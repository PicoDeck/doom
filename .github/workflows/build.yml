name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi zip

      - name: Build
        run: make

      - name: Install Emscripten (the version PicoDeck/web-sim pins)
        run: |
          git clone --depth 1 --branch 6.0.10 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install 6.0.10
          ~/emsdk/emsdk activate 6.0.10

      - name: Browser build (main.wasm, for PicoDeck/web-sim)
        run: make main.wasm

      - name: Package
        run: |
          rm -f picodeck-doom-*.zip
          zip -9 -r "picodeck-doom-${GITHUB_REF_NAME//\//-}.zip" app.json main.elf doom1.wad icon.png

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: picodeck-doom
          path: |
            picodeck-doom-*.zip
            main.wasm

      - name: Check app.json version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python3 -c 'import json; print(json.load(open("app.json"))["version"])')"
          if [ "$VER" != "$TAG" ]; then
            echo "app.json version '$VER' does not match tag '$TAG'" >&2
            exit 1
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            picodeck-doom-*.zip
            main.wasm
          generate_release_notes: true
