name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi zip

      - name: Build
        run: make

      - name: Package
        run: |
          rm -f picos-doom-*.zip
          zip -9 -r "picos-doom-${GITHUB_REF_NAME//\//-}.zip" app.json main.elf doom1.wad

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: picos-doom
          path: picos-doom-*.zip

      - name: Check app.json version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python3 -c 'import json; print(json.load(open("app.json"))["version"])')"
          if [ "$VER" != "$TAG" ]; then
            echo "app.json version '$VER' does not match tag '$TAG'" >&2
            exit 1
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: picos-doom-*.zip
          generate_release_notes: true
